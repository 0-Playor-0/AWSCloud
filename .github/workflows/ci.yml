name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests
        run: |
          if ls tests/**/test_*.py >/dev/null 2>&1; then pytest -q; else echo "no tests yet"; fi
