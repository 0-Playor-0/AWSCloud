AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Namma Check. One region only (DeployRegion).

Parameters:
  DeployRegion:
    Type: String
    Default: ap-southeast-2
    Description: The only region this stack may be deployed to (must match samconfig.toml).
  GitSha:
    Type: String
    Default: dev
    Description: Commit SHA reported by /v1/health.
  ExtractDailyCap:
    Type: Number
    Default: 300
    MinValue: 0
    Description: Paid extraction calls allowed per day (IST). Applies only to a metered extractor (bedrock, not built); client_ocr is never capped.
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 0
    Description: Lambda reserved concurrency. 0 = do not reserve (needed on accounts whose concurrency limit is too low to reserve any).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email for alarm notifications (passed at deploy time; never stored in the repo). Empty = alarms without notifications.
  ThrottleRate:
    Type: Number
    Default: 10
    Description: API requests per second (steady state) across all routes.
  ThrottleBurst:
    Type: Number
    Default: 20

Conditions:
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Rules:
  SingleRegion:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", !Ref DeployRegion]
        AssertDescription: Deploy only to DeployRegion (ap-southeast-2; the account allows no other).

Resources:
  CountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nc_counters
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRate
        ThrottlingBurstLimit: !Ref ThrottleBurst
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${SiteDistribution.DomainName}"]  # the site only
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        # Metadata only: no body, no query string, no headers, no IP.
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: backend.app.handler
      Runtime: python3.14
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 20
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Role: !GetAtt ApiFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref FunctionLogs
        LogFormat: JSON
      Environment:
        Variables:
          EXTRACTOR: client_ocr
          EXTRACT_DAILY_CAP: !Ref ExtractDailyCap
          TABLE_NAME: !Ref CountersTable
          GIT_SHA: !Ref GitSha
          POWERTOOLS_SERVICE_NAME: namma-check
          POWERTOOLS_LOGGER_LOG_EVENT: "false"
      Events:
        Extract:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /v1/extract}
        Compare:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /v1/compare}
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /v1/health}
        Stats:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /v1/stats}

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NammaCheckFunctionAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateFunctionLogGroup
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FunctionLogs}
              - Sid: WriteFunctionLogStreams
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FunctionLogs}:*
              - Sid: UseCounterTable
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt CountersTable.Arn

  # --- Operations dashboard (standard service metrics only) ------------------------------------

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-operations"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {"markdown": "# Namma Check operations\nRegion: ${AWS::Region} - request flow, execution and counter activity"}
            },
            {
              "type": "text", "x": 0, "y": 2, "width": 24, "height": 1,
              "properties": {"markdown": "## API Gateway"}
            },
            {
              "type": "metric", "x": 0, "y": 3, "width": 6, "height": 6,
              "properties": {
                "title": "API requests", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", "Stage", "$default"]]
              }
            },
            {
              "type": "metric", "x": 6, "y": 3, "width": 6, "height": 6,
              "properties": {
                "title": "API 4xx responses", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}", "Stage", "$default"]]
              }
            },
            {
              "type": "metric", "x": 12, "y": 3, "width": 6, "height": 6,
              "properties": {
                "title": "API 5xx responses", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", "Stage", "$default"]]
              }
            },
            {
              "type": "metric", "x": 18, "y": 3, "width": 6, "height": 6,
              "properties": {
                "title": "API latency (ms)", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Average",
                "metrics": [["AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", "Stage", "$default"]]
              }
            },
            {
              "type": "text", "x": 0, "y": 9, "width": 24, "height": 1,
              "properties": {"markdown": "## Lambda"}
            },
            {
              "type": "metric", "x": 0, "y": 10, "width": 5, "height": 6,
              "properties": {
                "title": "Lambda invocations", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}"]]
              }
            },
            {
              "type": "metric", "x": 5, "y": 10, "width": 5, "height": 6,
              "properties": {
                "title": "Lambda errors", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}"]]
              }
            },
            {
              "type": "metric", "x": 10, "y": 10, "width": 5, "height": 6,
              "properties": {
                "title": "Lambda average duration (ms)", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Average",
                "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}"]]
              }
            },
            {
              "type": "metric", "x": 15, "y": 10, "width": 5, "height": 6,
              "properties": {
                "title": "Lambda throttles", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/Lambda", "Throttles", "FunctionName", "${ApiFunction}"]]
              }
            },
            {
              "type": "metric", "x": 20, "y": 10, "width": 4, "height": 6,
              "properties": {
                "title": "Lambda concurrent executions", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Maximum",
                "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ApiFunction}"]]
              }
            },
            {
              "type": "text", "x": 0, "y": 16, "width": 24, "height": 1,
              "properties": {"markdown": "## DynamoDB counters"}
            },
            {
              "type": "metric", "x": 0, "y": 17, "width": 12, "height": 6,
              "properties": {
                "title": "Consumed read capacity units", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${CountersTable}"]]
              }
            },
            {
              "type": "metric", "x": 12, "y": 17, "width": 12, "height": 6,
              "properties": {
                "title": "Consumed write capacity units", "view": "timeSeries", "region": "${AWS::Region}",
                "period": 300, "stat": "Sum",
                "metrics": [["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${CountersTable}"]]
              }
            }
          ]
        }

  # --- Static site: private S3 bucket behind CloudFront (Origin Access Control) ----------------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: {Bool: {aws:SecureTransport: "false"}}

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # The API is reached directly (wildcard host avoids a template cycle); OCR runs as a
            # same-origin worker that compiles WebAssembly. No third-party hosts at all.
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
              Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Namma Check static site
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200  # includes edge locations in India, where the users are
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized (honours Cache-Control)
          ResponseHeadersPolicyId: !Ref SiteHeaders

  # --- Alarms (metadata only) --------------------------------------------------------------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors (unhandled exceptions or timeouts) in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda throttled by reserved concurrency (users see "try again").
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

  LambdaHighDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A Lambda request took 15 seconds or longer in 5 minutes (function timeout is 20 seconds).
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 15000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

  Api5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: More than 20% of API responses were 5xx over 5 minutes (at least 10 requests).
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions: [{Name: ApiId, Value: !Ref HttpApi}, {Name: Stage, Value: $default}]
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions: [{Name: ApiId, Value: !Ref HttpApi}, {Name: Stage, Value: $default}]
            Period: 300
            Stat: Sum
        - Id: rate
          Expression: IF(requests >= 10, errors / requests, 0)
          Label: 5xx rate
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0.2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

  CounterUnavailableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogs
      FilterPattern: '{ $.error_code = "counter_unavailable" }'
      MetricTransformations:
        - MetricNamespace: NammaCheck
          MetricName: CounterUnavailable
          MetricValue: "1"
          DefaultValue: 0

  CounterUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The DynamoDB counter store failed (stats are best effort; a cap would fail closed).
      Namespace: NammaCheck
      MetricName: CounterUnavailable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  SiteUrl:
    Description: Public URL of the site
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Description: Private bucket that holds the built site (scripts/deploy_site.sh)
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution (for cache invalidation)
    Value: !Ref SiteDistribution
  OperationsDashboardName:
    Description: CloudWatch operations dashboard name
    Value: !Ref OperationsDashboard
